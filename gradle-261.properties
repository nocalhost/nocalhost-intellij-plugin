# Existent IDE versions can be found in the following repos:
# https://www.jetbrains.com/intellij-repository/releases/
# https://www.jetbrains.com/intellij-repository/snapshots/
# 2026.1.5 (build 261.27258.48): the earlier EAP build 261.21525.39 predates all
# published 261.x java-compiler-ant-tasks (min 261.22158.273), breaking :instrumentCode
ideaVersion=2026.1.5

# see org.gradle.api.JavaVersion
# IDEA 2026.1 platform jars are compiled as class file 65 (Java 21)
javaCompatibility=VERSION_21

# Get the number from the IDE's download page
# For more info, see https://www.jetbrains.org/intellij/sdk/docs/basics/getting_started/build_number_ranges.html for description
sinceBuild=261
untilBuild=261.*
