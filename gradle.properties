org.gradle.jvmargs=-Xms512m -Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable JetBrains cache redirector: cache-redirector.jetbrains.com intermittently returns
# HTTP 502 (Bad Gateway) while serving plugin/marketplace artifacts (e.g. Go, PythonCore zips),
# which broke CI (initializeIntellijPlatformPlugin). Falling back to the direct JetBrains repos
# (plugins.jetbrains.com/maven, www.jetbrains.com/intellij-repository/...) avoids that proxy.
org.jetbrains.intellij.platform.useCacheRedirector=false

propertiesPluginEnvironmentNameProperty=platformVersion
# Supported platforms: 203, 211, 212, 213, 223, 231, ...
platformVersion=262

kotlin.code.style=official
kotlin.stdlib.default.dependency = false
version=0.6.37
